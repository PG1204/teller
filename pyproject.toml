[project]
name = "teller"
version = "0.1.0"
description = "Discovery-to-replay computer-use automation for legacy bank back-office UIs: an LLM discovers a flow once, the flow becomes a typed capability artifact, and deterministic replay runs it without a model."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "playwright>=1.50",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
  "anthropic>=1.0",
  "httpx>=0.27",
  # mock target app
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-playwright>=0.5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
teller = "teller.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src", "mockapp" = "mockapp" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teller = ["**/*.js", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: launches the mock app and a headless browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "mockapp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "N818"]  # domain exception names (ControlViolation) read better without the Error suffix

[tool.ruff.lint.per-file-ignores]
"src/teller/**/cli.py" = ["B008"]   # typer's Option/Argument-in-defaults idiom
"src/teller/cli.py" = ["B008"]
"tests/**" = ["B011", "N802"]
